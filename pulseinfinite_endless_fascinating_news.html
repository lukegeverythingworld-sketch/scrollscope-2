<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseInfinite - The Endless Feed of Fascinating News</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .story-glow {
            box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-full antialiased selection:bg-indigo-500 selection:text-white flex flex-col relative overflow-x-hidden">

    <!-- Ambient Screen Lighting Overlay -->
    <div id="ambient-lighting" class="fixed inset-0 pointer-events-none z-0 transition-all duration-1000 opacity-30" style="background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.4), transparent 70%);"></div>

    <!-- Sticky Header -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-panel border-b border-slate-800/80 px-4 lg:px-8 py-3 transition-all duration-300">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 animate-pulse-slow">
                    <i class="fa-solid fa-bolt text-white text-base"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">PulseInfinite</h1>
                    <p class="text-[10px] text-slate-400 font-medium">Endless Unique Visual Feed</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <div class="hidden xs:flex items-center bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800 text-xs text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping mr-2"></span>
                    <span id="story-counter">0 loaded</span>
                </div>
                <button onclick="toggleAmbientLighting()" id="ambient-toggle-btn" class="w-9 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 border border-indigo-500/50 flex items-center justify-center text-indigo-400 transition shadow-lg shadow-indigo-500/20" title="Toggle Fullscreen Photon Lighting">
                    <i class="fa-solid fa-lightbulb text-sm"></i>
                </button>
                <button onclick="openSettingsModal()" class="w-9 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 flex items-center justify-center text-slate-300 transition" title="Vibe Settings">
                    <i class="fa-solid fa-sliders text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Category Filter Bar -->
    <nav class="fixed top-14 left-0 right-0 z-40 bg-slate-950/70 backdrop-blur-md border-b border-slate-900 px-4 py-2.5 overflow-x-auto scrollbar-none">
        <div class="max-w-3xl mx-auto flex items-center space-x-2 min-w-max" id="category-filter-bar">
            <button onclick="filterCategory('All')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition">✨ All Topics</button>
            <button onclick="filterCategory('Politics')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">🏛️ Politics</button>
            <button onclick="filterCategory('Mythical Creatures')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">🐉 Mythical Creatures</button>
            <button onclick="filterCategory('Stories')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">📖 Stories</button>
            <button onclick="filterCategory('Vehicles')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">🏎️ Vehicles</button>
            <button onclick="filterCategory('Science')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">🔬 Science</button>
            <button onclick="filterCategory('Space')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">🌌 Space</button>
            <button onclick="filterCategory('Technology')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">🤖 Technology</button>
            <button onclick="filterCategory('Music')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">🎵 Music</button>
            <button onclick="filterCategory('Fun Facts')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition">💡 Fun Facts</button>
            <button onclick="filterCategory('Movies')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900/50 text-slate-500 border border-slate-800/50 hover:border-slate-700 transition opacity-80" title="Unconfirmed Section">🎬 Movies (Unconfirmed)</button>
        </div>
    </nav>

    <!-- Main Feed View -->
    <main class="flex-grow pt-28 pb-24 px-4 max-w-xl mx-auto w-full flex flex-col items-center">
        <!-- Dynamic Stories Container -->
        <div id="feed-container" class="w-full space-y-12">
            <!-- Cards populate dynamically here -->
        </div>

        <!-- Loading Spinner -->
        <div id="loading-indicator" class="py-12 flex flex-col items-center justify-center space-y-3 w-full">
            <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
            <p class="text-xs text-slate-400 tracking-wider uppercase font-semibold">Synthesizing unique visual story...</p>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 border border-slate-700/50 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base text-white flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span>Feed Vibe Focus</span>
                </h3>
                <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-3">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Select Topic Theme</label>
                <select id="vibe-select" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                    <option value="Mind-Bending Science & Anomalies">🔬 Mind-Bending Science & Anomalies</option>
                    <option value="Deep Space & Cosmic Mysteries">🌌 Deep Space & Cosmic Mysteries</option>
                    <option value="Mythical Creatures & Folklore">🐉 Mythical Creatures & Folklore</option>
                    <option value="Futuristic Tech & Vehicles">🏎️ Futuristic Tech & Vehicles</option>
                    <option value="Completely Random Unique Mix">✨ Completely Random Mix (Default)</option>
                </select>
                <p class="text-xs text-slate-500 leading-relaxed">
                    Tailors live AI story generation and completely distinct visual scenes.
                </p>
            </div>

            <button onclick="applySettings()" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold text-sm hover:from-indigo-500 hover:to-purple-500 shadow-lg shadow-indigo-600/30 transition">
                Apply & Refresh Feed
            </button>
        </div>
    </div>

    <script>
        let storyCount = 0;
        let isLoading = false;
        let currentVibe = "Completely Random Unique Mix";
        let ambientLightingActive = true;
        let selectedFilter = "All";
        let generatedStoryTitles = new Set(); // Track loaded titles to guarantee uniqueness

        const categories = [
            { name: "Science", color: "from-blue-500/20 to-indigo-500/20 text-indigo-400 border-indigo-500/30", icon: "fa-atom", glow: "rgba(79, 70, 229, 0.35)" },
            { name: "Space", color: "from-purple-500/20 to-indigo-500/20 text-purple-400 border-indigo-500/30", icon: "fa-globe", glow: "rgba(168, 85, 247, 0.35)" },
            { name: "Mythical Creatures", color: "from-amber-500/20 to-yellow-500/20 text-amber-400 border-amber-500/30", icon: "fa-dragon", glow: "rgba(245, 158, 11, 0.35)" },
            { name: "Politics", color: "from-rose-500/20 to-red-500/20 text-rose-400 border-rose-500/30", icon: "fa-landmark", glow: "rgba(244, 63, 94, 0.35)" },
            { name: "Vehicles", color: "from-cyan-500/20 to-blue-500/20 text-cyan-400 border-cyan-500/30", icon: "fa-car", glow: "rgba(6, 182, 212, 0.35)" },
            { name: "Technology", color: "from-emerald-500/20 to-teal-500/20 text-emerald-400 border-emerald-500/30", icon: "fa-microchip", glow: "rgba(16, 185, 129, 0.35)" },
            { name: "Music", color: "from-pink-500/20 to-rose-500/20 text-pink-400 border-pink-500/30", icon: "fa-music", glow: "rgba(236, 72, 153, 0.35)" },
            { name: "Stories", color: "from-orange-500/20 to-amber-500/20 text-orange-400 border-orange-500/30", icon: "fa-book-open", glow: "rgba(249, 115, 22, 0.35)" },
            { name: "Fun Facts", color: "from-yellow-500/20 to-lime-500/20 text-yellow-400 border-yellow-500/30", icon: "fa-lightbulb", glow: "rgba(234, 179, 8, 0.35)" },
            { name: "Movies", color: "from-violet-500/20 to-purple-500/20 text-violet-400 border-violet-500/30", icon: "fa-film", glow: "rgba(139, 92, 246, 0.35)" }
        ];

        // Your 3 initial stories
        const curatedStories = [
            {
                title: "Deep-Sea Submersible Discovers Ancient, Geometrically Perfect Pyramids Beneath the Antarctic Ice Sheet",
                category: "Science",
                readTime: "4 min read",
                summary: "While mapping uncharted underwater trenches beneath the Ross Ice Shelf, an autonomous research submarine captured sonar imagery of three massive, smooth-sided structures rising nearly 800 feet from the dark ocean floor.",
                content: "Preliminary thermal scans suggest the structures are composed of an unknown metallic alloy that appears to be actively generating localized heat, keeping the surrounding seawater at a steady 22°C (72°F) in an otherwise freezing abyss. Marine geologists and historians are scrambling to mount an immediate expedition, completely baffled by how massive artificial architecture could exist beneath thousands of feet of solid ice.",
                quote: "The thermal variance in absolute pitch blackness defies every known geological model of the southern polar shelf.",
                author: "Dr. Valerie Vance",
                source: "Deep Subsurface Exploration Bureau",
                imagePrompt: "Massive glowing metallic pyramids under dark freezing Antarctic ocean ice shelf with a submarine, cinematic lighting, 8k"
            },
            {
                title: "Commercial Telescope Array Captures Signal Repeating Every 42 Minutes from Deep Space",
                category: "Space",
                readTime: "3 min read",
                summary: "Astronomers operating a private global array of radio telescopes announced the detection of a persistent, highly structured narrowband radio signal originating from a dark void in the constellation Cygnus.",
                content: "Unlike natural cosmic phenomena like pulsars—which pulse with random or decaying rhythms—this signal repeats with a mathematically precise sequence of prime numbers every exactly 42 minutes and 12 seconds. Data decoding teams have successfully isolated a repeating data stream hidden within the frequency, sparking intense debate in the scientific community over whether it's an unprecedented natural pulsar anomaly or something manufactured.",
                quote: "When a signal counts in prime numbers across stellar distances, nature ceases to be the primary suspect.",
                author: "Dr. Aris Thorne",
                source: "Interstellar Signal Observatory",
                imagePrompt: "Gigantic radio telescope dish pointing into deep starry night sky with glowing digital frequency wave overlay, cinematic sci-fi"
            },
            {
                title: "Global GPS Glitch Temporarily Forces Every Stray Pigeon to Flock Around City Hall",
                category: "Stories",
                readTime: "3 min read",
                summary: "In a bizarre simultaneous event across twelve major metropolitan areas worldwide, millions of urban pigeons abruptly abandoned their usual roosts and formed massive, swirling geometric patterns directly above municipal government buildings.",
                content: "Navigation experts initially suspected a localized electromagnetic anomaly or satellite spoofing attack. However, data analysts discovered that the birds' synchronized flight paths perfectly mirrored the layout of underground transit maps that were classified back in the 1950s. City officials are investigating whether an accidental municipal radar test triggered the behavior, or if the city's feathered residents simply decided to stage a peaceful protest.",
                quote: "Millions of birds executing a precise 1950s subway blueprint simultaneously is not something evolution prepared us for.",
                author: "Marcus J. Chen",
                source: "Urban Wildlife Intelligence",
                imagePrompt: "Millions of pigeons forming geometric swirling patterns over a grand old city hall building at twilight, moody surrealism"
            }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            for (let i = 0; i < curatedStories.length; i++) {
                generatedStoryTitles.add(curatedStories[i].title);
                await renderStoryCard(curatedStories[i]);
            }

            window.addEventListener('scroll', () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 900) {
                    if (!isLoading) {
                        loadMoreStories(2);
                    }
                }
                updateAmbientLightingOnScroll();
            });
        });

        function filterCategory(catName) {
            selectedFilter = catName;
            
            const buttons = document.querySelectorAll('#category-filter-bar button');
            buttons.forEach(btn => {
                if (btn.textContent.includes(catName) || (catName === 'All' && btn.textContent.includes('All'))) {
                    btn.className = "category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 transition";
                } else {
                    btn.className = "category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-slate-300 border border-slate-800 hover:border-slate-700 transition";
                }
            });

            const articles = document.querySelectorAll('article');
            articles.forEach(art => {
                const cardCat = art.getAttribute('data-category');
                if (selectedFilter === 'All' || cardCat.toLowerCase() === selectedFilter.toLowerCase()) {
                    art.style.display = 'block';
                } else {
                    art.style.display = 'none';
                }
            });
        }

        function toggleAmbientLighting() {
            ambientLightingActive = !ambientLightingActive;
            const lightingEl = document.getElementById('ambient-lighting');
            const btn = document.getElementById('ambient-toggle-btn');
            if (ambientLightingActive) {
                lightingEl.style.opacity = '0.3';
                btn.className = "w-9 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 border border-indigo-500/50 flex items-center justify-center text-indigo-400 transition shadow-lg shadow-indigo-500/20";
            } else {
                lightingEl.style.opacity = '0';
                btn.className = "w-9 h-9 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 flex items-center justify-center text-slate-500 transition";
            }
        }

        function updateAmbientLightingOnScroll() {
            if (!ambientLightingActive) return;
            const cards = document.querySelectorAll('article');
            const scrollPos = window.scrollY + window.innerHeight / 2;

            for (let card of cards) {
                if (card.style.display === 'none') continue;
                const rect = card.getBoundingClientRect();
                const cardTop = rect.top + window.scrollY;
                const cardBottom = cardTop + rect.height;

                if (scrollPos >= cardTop && scrollPos <= cardBottom) {
                    const catAttr = card.getAttribute('data-category');
                    const catObj = categories.find(c => c.name.toLowerCase() === (catAttr || '').toLowerCase()) || categories[0];
                    const lightingEl = document.getElementById('ambient-lighting');
                    lightingEl.style.background = `radial-gradient(circle at 50% 40%, ${catObj.glow}, transparent 75%)`;
                    break;
                }
            }
        }

        function openSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        async function applySettings() {
            currentVibe = document.getElementById('vibe-select').value;
            closeSettingsModal();
            document.getElementById('feed-container').innerHTML = '';
            storyCount = 0;
            generatedStoryTitles.clear();
            for (let i = 0; i < curatedStories.length; i++) {
                generatedStoryTitles.add(curatedStories[i].title);
                await renderStoryCard(curatedStories[i]);
            }
            loadMoreStories(2);
        }

        async function fetchAiStory() {
            try {
                const systemPrompt = "You are a master creative journalist. Every time you are called, you must invent a completely distinct, highly original, fascinating topic and news story. Never repeat previous themes or headlines.";
                const targetCategory = selectedFilter !== 'All' ? selectedFilter : ["Politics", "Mythical Creatures", "Stories", "Vehicles", "Science", "Space", "Technology", "Music", "Fun Facts", "Movies"][Math.floor(Math.random() * 10)];
                
                const existingTitles = Array.from(generatedStoryTitles).join(", ");
                const userPrompt = `Generate a brand new, completely unique, fascinating news story focusing on category "${targetCategory}" and vibe "${currentVibe}". 
                CRITICAL: The headline must be entirely different from any of these previously used titles: [${existingTitles}].
                Return JSON with keys:
                - title (catchy, completely unique headline)
                - category (must be exactly one of: Politics, Mythical Creatures, Stories, Vehicles, Science, Space, Technology, Music, Fun Facts, Movies)
                - readTime (e.g. "3 min read")
                - summary (1 punchy engaging teaser sentence)
                - content (2 rich, detailed paragraphs explaining the fascinating phenomenon vividly)
                - quote (striking expert or historical quote)
                - author (author name)
                - source (credible publication name)
                - imagePrompt (a distinct, highly specific cinematic visual prompt describing the scene for an image generation placeholder)`;

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                title: { type: "STRING" },
                                category: { type: "STRING" },
                                readTime: { type: "STRING" },
                                summary: { type: "STRING" },
                                content: { type: "STRING" },
                                quote: { type: "STRING" },
                                author: { type: "STRING" },
                                source: { type: "STRING" },
                                imagePrompt: { type: "STRING" }
                            },
                            required: ["title", "category", "readTime", "summary", "content", "quote", "author", "source", "imagePrompt"]
                        }
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const parsed = JSON.parse(candidate.content.parts[0].text);
                    if (!generatedStoryTitles.has(parsed.title)) {
                        generatedStoryTitles.add(parsed.title);
                        return parsed;
                    }
                }
            } catch (e) {
                console.log("Using unique fallback story", e);
            }

            // Unique fallback generator to prevent any repetition
            const fallbackPool = [
                {
                    title: `Acoustic Anomaly in the Mariana Trench Records Repeating Melodic Chants at ${Math.floor(Math.random() * 8900 + 1000)} Meters`,
                    category: "Science",
                    readTime: "3 min read",
                    summary: "Deep-sea hydrophones deployed in the western Pacific record harmonic frequencies resembling ancient vocal scales.",
                    content: "While recording tectonic plate friction in the deepest trench on Earth, deep-sea marine acoustics arrays picked up low-frequency harmonic resonance. When slowed down by 400%, the sound wave forms a precise pentatonic scale that acoustic engineers confirm is not generated by seismic activity or marine mammal vocalizations.",
                    quote: "The mathematical ratios within the acoustic wave mirror early human modal music.",
                    author: "Dr. Elena Rostova",
                    source: "Pacific Oceanic Acoustics",
                    imagePrompt: "Deep underwater trench with glowing blue hydrophone arrays and mysterious sound waves in dark abyss, cinematic"
                },
                {
                    title: "Historical Archives Uncover Lost Blueprint for Nikola Tesla's Unbuilt Atmospheric Power Station",
                    category: "Technology",
                    readTime: "4 min read",
                    summary: "Newly discovered notebooks detail a compact ionic receiver designed to harness ambient atmospheric electrical potential.",
                    content: "Archivists cataloging personal effects from a Colorado Springs estate found sealed brass cylinders containing detailed patent schematics drawn by Nikola Tesla in 1901. The plans outline a passive copper spiral tower that extracts usable wattage directly from the Earth's ionospheric gradient without burning fuel or batteries.",
                    quote: "Tesla was not merely inventing gadgets; he was tapping into the planet's perpetual energy pulse.",
                    author: "Julian Vance",
                    source: "Historical Engineering Gazette",
                    imagePrompt: "Vintage copper Tesla tower discharging gentle electrical sparks against a dramatic stormy sunset sky, detailed artstation"
                }
            ];

            for (let f of fallbackPool) {
                if (!generatedStoryTitles.has(f.title)) {
                    generatedStoryTitles.add(f.title);
                    return f;
                }
            }

            return {
                title: `Unexplained Phenomenon Detected Across Sector ${Math.floor(Math.random() * 900 + 100)}: The Quantum Shift`,
                    category: "Space",
                    readTime: "3 min read",
                    summary: "Sensors worldwide register sudden synchronized shifts in quantum particle spin rates.",
                    content: "Laboratories across three continents reported a simultaneous fluctuation in quantum entanglement stability. Physicists are currently analyzing whether this atmospheric variance stems from solar wind anomalies or an undiscovered cosmic ray interaction.",
                    quote: "We are observing reality adjust its baseline in real time.",
                    author: "Dr. K. L. Meade",
                    source: "Quantum Physics Today",
                    imagePrompt: "Abstract futuristic laboratory with glowing quantum particles floating in midair, cybernetic blue and purple lighting, 8k"
            };
        }

        async function generateStoryImage(promptText) {
            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                const payload = {
                    instances: { prompt: promptText + ", cinematic lighting, photorealistic, 8k, detailed artstation, unique perspective " + Math.random() },
                    parameters: { sampleCount: 1 }
                };

                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (data.predictions?.[0]?.bytesBase64Encoded) {
                    return `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                }
            } catch (e) {
                console.log("Imagen fallback used", e);
            }
            return `https://picsum.photos/seed/${Math.random().toString(36).substring(7)}/800/500`;
        }

        async function renderStoryCard(story) {
            storyCount++;
            const counterEl = document.getElementById('story-counter');
            if (counterEl) {
                counterEl.innerText = `${storyCount} loaded`;
            }

            const imageUrl = await generateStoryImage(story.imagePrompt || story.title);
            const catObj = categories.find(c => c.name.toLowerCase() === (story.category || '').toLowerCase()) || categories[0];

            const container = document.getElementById('feed-container');
            if (!container) return;

            const card = document.createElement('article');
            card.className = "glass-panel rounded-3xl overflow-hidden border border-slate-800/80 story-glow transition-all duration-300 w-full relative z-10";
            card.setAttribute('data-category', catObj.name);

            if (selectedFilter !== 'All' && catObj.name.toLowerCase() !== selectedFilter.toLowerCase()) {
                card.style.display = 'none';
            }
            
            card.innerHTML = `
                <div class="relative w-full h-64 sm:h-72 bg-slate-900 overflow-hidden group">
                    <img src="${imageUrl}" alt="${story.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" onerror="this.src='https://picsum.photos/800/500'">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                    
                    <div class="absolute top-4 left-4 right-4 flex items-center justify-between">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-950/80 backdrop-blur-md ${catObj.color} border shadow-lg">
                            <i class="fa-solid ${catObj.icon} mr-1.5"></i> ${catObj.name}
                        </span>
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-slate-950/80 backdrop-blur-md text-slate-300 border border-slate-700/50">
                            <i class="fa-regular fa-clock mr-1"></i> ${story.readTime}
                        </span>
                    </div>
                </div>

                <div class="p-6 sm:p-8">
                    <h3 class="font-serif text-xl sm:text-2xl font-bold text-white mb-3 tracking-tight leading-snug">
                        ${story.title}
                    </h3>

                    <p class="text-slate-300 text-sm sm:text-base font-medium mb-6 leading-relaxed bg-slate-900/50 p-4 rounded-2xl border border-slate-800/60">
                        ${story.summary}
                    </p>

                    <div class="text-slate-300 text-sm sm:text-base leading-relaxed space-y-4 mb-6">
                        <p>${story.content}</p>
                    </div>

                    ${story.quote ? `
                        <blockquote class="border-l-2 border-indigo-500 pl-4 my-6 italic text-slate-300 text-sm">
                            "${story.quote}"
                        </blockquote>
                    ` : ''}

                    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center font-bold text-indigo-400 text-xs">
                                ${story.author.charAt(0)}
                            </div>
                            <div>
                                <span class="font-semibold text-slate-200">${story.author}</span>
                                <span class="block text-[10px] text-slate-500">${story.source}</span>
                            </div>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button onclick="shareStory(this)" class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white transition" title="Share">
                                <i class="fa-solid fa-share-nodes"></i>
                            </button>
                            <button onclick="toggleBookmark(this)" class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-indigo-400 transition" title="Bookmark">
                                <i class="fa-regular fa-bookmark"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            container.appendChild(card);
        }

        async function loadMoreStories(count) {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('loading-indicator').style.display = 'flex';

            for (let i = 0; i < count; i++) {
                const story = await fetchAiStory();
                await renderStoryCard(story);
            }

            isLoading = false;
            document.getElementById('loading-indicator').style.display = 'none';
        }

        function shareStory(btn) {
            try {
                const dummy = document.createElement('textarea');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);

                const icon = btn.querySelector('i');
                const originalClass = icon.className;
                icon.className = "fa-solid fa-check text-emerald-400";
                setTimeout(() => { icon.className = originalClass; }, 2000);
            } catch (err) {
                console.log("Clipboard error", err);
            }
        }

        function toggleBookmark(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-regular')) {
                icon.className = "fa-solid fa-bookmark text-indigo-400";
            } else {
                icon.className = "fa-regular fa-bookmark";
            }
        }
    </script>
</body>
</html>
